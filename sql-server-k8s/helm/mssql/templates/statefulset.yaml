apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "mssql.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mssql.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "mssql.fullname" . }}-headless
  replicas: 1
  selector:
    matchLabels:
      {{- include "mssql.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "mssql.selectorLabels" . | nindent 8 }}
    spec:
      terminationGracePeriodSeconds: 60
      serviceAccountName: {{ .Values.serviceAccount.name }}
      securityContext:
        fsGroup: 10001
        runAsUser: 10001
        runAsGroup: 10001
        runAsNonRoot: true
      containers:
      - name: mssql
        image: {{ .Values.mssql.image }}:{{ .Values.mssql.tag }}
        ports:
        - containerPort: 1433
          name: mssql
          protocol: TCP
        env:
        - name: ACCEPT_EULA
          value: "Y"
        - name: MSSQL_PID
          value: {{ .Values.mssql.pid | quote }}
        - name: MSSQL_DATA_DIR
          value: "/var/opt/mssql/data"
        - name: MSSQL_LOG_DIR
          value: "/var/opt/mssql/log"
        - name: MSSQL_BACKUP_DIR
          value: "/var/opt/mssql/backup"
        - name: MSSQL_AGENT_ENABLED
          value: {{ .Values.mssql.agentEnabled | quote }}
        - name: MSSQL_MEMORY_LIMIT_MB
          value: {{ .Values.mssql.memoryLimitMB | quote }}
        command:
        - /bin/bash
        - -c
        - |
          export MSSQL_SA_PASSWORD=$(cat /mnt/secrets/password)
          /opt/mssql/bin/sqlservr &
          SQL_PID=$!
          sleep 30
          /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$MSSQL_SA_PASSWORD" -C \
            -Q "ALTER SERVER CONFIGURATION SET PROCESS AFFINITY CPU = 0 to 3;"
          wait $SQL_PID
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
        volumeMounts:
        - name: mssql-data
          mountPath: /var/opt/mssql/data
        - name: mssql-log
          mountPath: /var/opt/mssql/log
        - name: mssql-backup
          mountPath: /var/opt/mssql/backup
        - name: mssql-config
          mountPath: /var/opt/mssql/mssql.conf
          subPath: mssql.conf
        - name: secrets-store
          mountPath: /mnt/secrets
          readOnly: true
        livenessProbe:
          tcpSocket:
            port: 1433
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          tcpSocket:
            port: 1433
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
      volumes:
      - name: mssql-config
        configMap:
          name: {{ include "mssql.fullname" . }}-config
      - name: secrets-store
        csi:
          driver: secrets-store.csi.k8s.io
          readOnly: true
          volumeAttributes:
            secretProviderClass: {{ include "mssql.fullname" . }}-secret
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - {{ .Chart.Name }}
              topologyKey: kubernetes.io/hostname
  volumeClaimTemplates:
  - metadata:
      name: mssql-data
      labels:
        {{- include "mssql.selectorLabels" . | nindent 8 }}
        volume-type: data
    spec:
      accessModes:
      - ReadWriteOnce
      storageClassName: {{ .Values.storage.className }}
      resources:
        requests:
          storage: {{ .Values.storage.data.size }}
  - metadata:
      name: mssql-log
      labels:
        {{- include "mssql.selectorLabels" . | nindent 8 }}
        volume-type: log
    spec:
      accessModes:
      - ReadWriteOnce
      storageClassName: {{ .Values.storage.className }}
      resources:
        requests:
          storage: {{ .Values.storage.log.size }}
  - metadata:
      name: mssql-backup
      labels:
        {{- include "mssql.selectorLabels" . | nindent 8 }}
        volume-type: backup
    spec:
      accessModes:
      - ReadWriteOnce
      storageClassName: {{ .Values.storage.className }}
      resources:
        requests:
          storage: {{ .Values.storage.backup.size }}
