{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "mssql.fullname" . }}-netpol
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mssql.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "mssql.selectorLabels" . | nindent 6 }}
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          access-mssql: "true"
    ports:
    - protocol: TCP
      port: 1433
  # Allow NLB health checks on port 1433 from known network ranges only
  # (NLB subnet CIDRs or the VPC CIDR block), not the entire internet.
  - from:
    {{- range .Values.networkPolicy.healthCheckCidrs }}
    - ipBlock:
        cidr: {{ . }}
    {{- end }}
    ports:
    - protocol: TCP
      port: 1433
  egress:
  - to:
    - namespaceSelector: {}
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
  # Allow HTTPS for AWS Secrets Manager API calls
  - to:
    - ipBlock:
        cidr: 0.0.0.0/0
    ports:
    - protocol: TCP
      port: 443
{{- end }}
